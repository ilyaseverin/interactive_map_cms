version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: strapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-strapi_db}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - strapi-network

  strapi:
    build: .
    container_name: strapi_app
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-1337}
      - APP_KEYS=${APP_KEYS}
      - API_TOKEN_SALT=${API_TOKEN_SALT}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - TRANSFER_TOKEN_SALT=${TRANSFER_TOKEN_SALT}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_CLIENT=${DATABASE_CLIENT:-postgres}
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_NAME=${DATABASE_NAME:-strapi_db}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-strapi_user}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD}
      - DATABASE_SSL=${DATABASE_SSL:-false}
      - VIRTUAL_HOST=${AUTO_SSL_VIRTUAL_HOST}
      - LETSENCRYPT_HOST=${AUTO_SSL_LETSENCRYPT_HOST}
      - LETSENCRYPT_EMAIL=${AUTO_SSL_LETSENCRYPT_EMAIL}
      - VIRTUAL_PORT=${AUTO_SSL_VIRTUAL_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/opt/app
      - strapi_node_modules:/opt/app/node_modules
    ports:
      - "1337:1337"
    depends_on:
      - postgres
    networks:
      - strapi-network

volumes:
  postgres_data:
  strapi_node_modules:

networks:
  strapi-network:
    driver: bridge
